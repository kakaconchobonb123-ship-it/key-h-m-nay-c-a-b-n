<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LimboHub - Hệ Thống Key Bảo Mật 24H</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Chữ LIMBOHUB ẩn ở rất xa theo yêu cầu bảo mật */
        .hidden-brand-token {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .container {
            text-align: center;
            background: linear-gradient(145deg, #161616, #1c1c1c);
            border: 2px solid #ff3b3b;
            box-shadow: 0 0 25px rgba(255, 59, 59, 0.4);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
        }

        h2 {
            color: #ff3b3b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .brand {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .key-box {
            background-color: #111;
            border: 1px dashed #ff3b3b;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #00ffcc;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .timer {
            font-size: 14px;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        button {
            background: linear-gradient(135deg, #ff3b3b, #b30000);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .status {
            font-size: 13px;
            color: #aaa;
            margin-top: 10px;
        }

        /* Màn hình khóa khi hết 5 phút hoặc hết hạn */
        #lockScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        #lockScreen h1 {
            color: #ff3b3b;
            margin-bottom: 10px;
        }
        #lockScreen p {
            color: #ccc;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Thẻ ẩn chứa chữ LIMBOHUB ở rất xa -->
    <div class="hidden-brand-token" id="secretBrand">LIMBOHUB</div>

    <!-- Giao diện chính -->
    <div class="container" id="mainContainer">
        <h2>LIMBOHUB</h2>
        <div class="brand">XÁC THỰC KEY BẢO MẬT (24H)</div>

        <div class="key-box" id="keyDisplay">Đang tải key...</div>
        <div class="timer" id="timerDisplay">Thời gian: Đang cập nhật...</div>

        <!-- Ô để người chơi nhập key -->
        <input type="text" id="userInputKey" placeholder="Nhập key của bạn vào đây...">
        <button onclick="verifyKey()">Kiểm tra & Xác thực Key</button>
        
        <button id="actionBtn" style="background: #333;" onclick="handleAction()">Sao chép key</button>
        
        <div class="status" id="statusMsg">Trạng thái: Sẵn sàng</div>
    </div>

    <!-- Màn hình biến mất/khóa trang web sau 5 phút hoặc hết hạn -->
    <div id="lockScreen">
        <h1>🔒 TRANG WEB ĐÃ ĐÓNG</h1>
        <p id="lockMsg">Phiên làm việc đã kết thúc. Vui lòng vượt link mới để lấy key mới!</p>
        <button style="max-width: 250px; margin-top: 20px; background: linear-gradient(135deg, #ff9900, #cc6600);" onclick="location.reload()">Vượt link lấy key mới</button>
    </div>

    <script>
        const EXPIRATION_TIME = 24 * 60 * 60 * 1000; // Key có hiệu lực 24 giờ
        const DESTROY_TIME = 5 * 60 * 1000; // Đóng web sau 5 phút kể từ lúc lấy key
        const POSSIBLE_CODES = ["71", "92", "13"]; // 3 số nhận diện ngẫu nhiên ở cuối

        function getBrandPrefix() {
            let element = document.getElementById("secretBrand");
            let val = element ? element.innerText.trim() : "";
            return (val !== "") ? val : "LIMBOHUB";
        }

        function createSignature(str) {
            let secretSalt = "limbohub_secure_5min_v6";
            let hash = 0;
            let combined = str + secretSalt;
            for (let i = 0; i < combined.length; i++) {
                let char = combined.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0; 
            }
            return Math.abs(hash).toString(36).toUpperCase();
        }

        function initKeySystem() {
            let currentKeyData = JSON.parse(localStorage.getItem("limbohub_key_v6"));
            let now = new Date().getTime();

            // Nếu chưa có key, hoặc key quá 24h, hoặc đã kích hoạt lệnh tự hủy 5 phút trước đó -> Tạo key mới
            if (!currentKeyData || now > currentKeyData.expiresAt || (currentKeyData.destroyAt && now > currentKeyData.destroyAt)) {
                // Xóa sạch trạng thái cũ để cấp key ngẫu nhiên hoàn toàn mới
                localStorage.removeItem("limbohub_key_v6");

                let brandPrefix = getBrandPrefix(); // Luôn lấy chữ LIMBOHUB làm gốc
                let chosenIdentifier = POSSIBLE_CODES[Math.floor(Math.random() * POSSIBLE_CODES.length)];
                
                let randomPart = Math.random().toString(36).substring(2, 7).toUpperCase();
                let rawString = brandPrefix + "-" + randomPart + "-" + now;
                let signature = createSignature(rawString);
                
                let secureKey = brandPrefix + "-" + randomPart + "-" + signature + "-" + chosenIdentifier;

                currentKeyData = {
                    key: secureKey,
                    identifier: chosenIdentifier, 
                    expiresAt: now + EXPIRATION_TIME,
                    destroyAt: null // Chưa kích hoạt đếm ngược 5 phút
                };
                localStorage.setItem("limbohub_key_v6", JSON.stringify(currentKeyData));
            }

            // Kiểm tra nếu đã đến thời điểm tự hủy (sau 5 phút bấm copy)
            if (currentKeyData.destroyAt && now >= currentKeyData.destroyAt) {
                triggerLockScreen("Đã hết thời gian 5 phút. Trang web đã tự động đóng!");
                return;
            }

            updateUI();
        }

        function updateUI() {
            let currentKeyData = JSON.parse(localStorage.getItem("limbohub_key_v6"));
            if (!currentKeyData) return;

            let now = new Date().getTime();

            // Kiểm tra nếu đang trong tiến trình đếm ngược 5 phút tự hủy
            if (currentKeyData.destroyAt) {
                let timeLeftDestroy = currentKeyData.destroyAt - now;
                if (timeLeftDestroy <= 0) {
                    triggerLockScreen("Đã hết thời gian 5 phút. Trang web đã tự động đóng!");
                    return;
                }
                let min = Math.floor((timeLeftDestroy % (1000 * 60 * 60)) / (1000 * 60));
                let sec = Math.floor((timeLeftDestroy % (1000 * 60)) / 1000);
                document.getElementById("timerDisplay").innerText = `⚠️ Web sẽ tự đóng sau: ${min}m ${sec}s`;
                document.getElementById("keyDisplay").innerText = currentKeyData.key;
                document.getElementById("actionBtn").innerText = "Đã sao chép";
                document.getElementById("actionBtn").style.background = "#222";
                return;
            }

            let timeLeft = currentKeyData.expiresAt - now;
            if (timeLeft <= 0) {
                triggerLockScreen("Key đã hết hạn 24 giờ. Vui lòng vượt link lấy key mới!");
            } else {
                document.getElementById("keyDisplay").innerText = currentKeyData.key;
                let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                
                document.getElementById("timerDisplay").innerText = `Hết hạn sau: ${hours}h ${minutes}m ${seconds}s`;
                document.getElementById("actionBtn").innerText = "Sao chép key";
                document.getElementById("actionBtn").style.background = "linear-gradient(135deg, #333, #555)";
            }
        }

        function triggerLockScreen(msg) {
            localStorage.removeItem("limbohub_key_v6");
            document.getElementById("mainContainer").style.display = "none";
            document.getElementById("lockMsg").innerText = msg;
            document.getElementById("lockScreen").style.display = "flex";
        }

        function verifyKey() {
            let inputVal = document.getElementById("userInputKey").value.trim();
            let currentKeyData = JSON.parse(localStorage.getItem("limbohub_key_v6"));
            let now = new Date().getTime();

            if (!currentKeyData || now > currentKeyData.expiresAt) {
                triggerLockScreen("Key đã hết hạn! Vui lòng vượt link lấy key mới.");
                return;
            }

            if (inputVal === currentKeyData.key && inputVal.startsWith("LIMBOHUB") && inputVal.endsWith(currentKeyData.identifier)) {
                document.getElementById("statusMsg").innerText = `✅ Xác thực thành công! (Đuôi: ${currentKeyData.identifier})`;
                alert("Thành công! Key của bạn chính xác.");
            } else {
                document.getElementById("statusMsg").innerText = "❌ Sai key hoặc sai định dạng!";
                alert("Thất bại! Key không đúng hoặc sai mã nhận diện.");
            }
        }

        function handleAction() {
            let currentKeyData = JSON.parse(localStorage.getItem("limbohub_key_v6"));
            let now = new Date().getTime();

            if (!currentKeyData) return;

            // Khi người chơi bấm sao chép key -> Bắt đầu kích hoạt đếm ngược 5 phút để tự hủy web
            if (!currentKeyData.destroyAt) {
                let keyText = currentKeyData.key;
                navigator.clipboard.writeText(keyText).then(() => {
                    currentKeyData.destroyAt = now + DESTROY_TIME; // Đặt mốc thời gian tự hủy sau 5 phút
                    localStorage.setItem("limbohub_key_v6", JSON.stringify(currentKeyData));
                    document.getElementById("statusMsg").innerText = "📋 Đã sao chép! Trang web sẽ đóng sau 5 phút.";
                });
            }
        }

        setInterval(updateUI, 1000);
        window.onload = initKeySystem;
    </script>
</body>
</html>
